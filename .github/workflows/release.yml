# version.py 의 APP_VERSION 을 올려서 GitHub 에 올리면
# 윈도우 exe 를 만들어 Releases 에 v<버전> 으로 올린다.
# 이미 설치된 프로그램은 켤 때 이 릴리스를 보고 업데이트 창을 띄운다.
name: Build release

on:
  push:
    branches: [main]
    paths: [version.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Read version
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python -c "import version; print(version.APP_VERSION)")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" > /dev/null 2>&1; then
            echo "Release v$VER already exists - nothing to do"
            echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install packages
        if: steps.ver.outputs.exists == '0'
        run: python -m pip install -r requirements.txt

      - name: Check sources
        if: steps.ver.outputs.exists == '0'
        run: python -m py_compile app.py main_window.py presenter_window.py thumbnail_utils.py text_engine.py ppt_engine.py subtitles.py music_player.py image_notes.py mix_bundle.py version.py updater.py update_dialog.py

      - name: Build exe
        if: steps.ver.outputs.exists == '0'
        run: python -m PyInstaller --noconfirm BgTextPresenter.spec

      - name: Zip
        if: steps.ver.outputs.exists == '0'
        shell: bash
        run: |
          test -f dist/BgTextPresenter/BgTextPresenter.exe
          cd dist && 7z a -tzip -mx=7 ../BgTextPresenter-win64.zip BgTextPresenter > /dev/null
          ls -l ../BgTextPresenter-win64.zip

      - name: Publish release
        if: steps.ver.outputs.exists == '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONIOENCODING: utf-8
        run: |
          python -c "import version; open('notes.md', 'w', encoding='utf-8').write(version.RELEASE_NOTES)"
          gh release create "v${{ steps.ver.outputs.version }}" BgTextPresenter-win64.zip \
            --title "v${{ steps.ver.outputs.version }}" --notes-file notes.md --target "$GITHUB_SHA"
